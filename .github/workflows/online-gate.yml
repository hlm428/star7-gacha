name: star7-online-gate

# P8 · O-14：部署后环境门禁（只打真实线上 URL，不改动 regression_v5_gate.py 的任何断言）
# P10 · O-22：只保留 deployment_status（github-pages / success）+ 手动触发。
# 原 workflow_run（pages build and deployment completed）与 deployment_status 是同一次部署的
# 两个事件源，靠 concurrency 取消其中一个，结果是每个 commit 产生一次实跑 + 一次 cancelled，
# 累计 500+ 次运行把真实失败淹没。去掉 workflow_run 后单次部署只产生 1 次执行。
on:
  deployment_status:
  workflow_dispatch:

# 去重：同一 commit 的重复 success 状态不再互相取消（cancel-in-progress: false），
# 后到的运行会完整跑完并覆盖同一份公开文档（幂等）。实测：Pages 偶发对同一 commit
# 连发两次 success，取消在跑的那次会留下 cancelled 噪声（近 100 次里 2 次）。
concurrency:
  group: star7-online-gate-${{ github.event.deployment.sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write  # P9 · O-20：把线上门禁摘要写回 docs/gates/ 需要 contents 写权限

jobs:
  online-gate:
    # Pages 部署成功才跑；deployment_status 只接受 github-pages 环境 + success；手动触发不受此限制
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: work/requirements-ci.txt

      - name: Install Playwright（仅测试依赖，产品仍为零依赖单文件）
        run: |
          python -m pip install --upgrade pip
          pip install -r work/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run online gate（O1 console / O2 pageerror / O3 4xx-5xx / O4 28 webp / O5 42 mp3 / O6 冷加载 / O7 版本）
        run: python work/online_gate.py

      - name: Publish PASS/FAIL to job summary
        if: always()
        run: |
          {
            echo "## star7 online gate（部署后环境门禁）"
            echo ""
            if [ -f work/online-gate-report.md ]; then
              cat work/online-gate-report.md
            else
              echo "❌ 未生成 work/online-gate-report.md：线上门禁脚本可能提前失败，请查看上方步骤日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail run visibly when gate failed
        if: failure()
        run: |
          echo "❌ 线上门禁 FAIL：详见本 run 的 Summary 与 online_gate.py 日志。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # P9 · O-20：PASS/FAIL 摘要同步写回仓库公开文档 docs/gates/online-gate.md（保留 job summary）
      # P10 · O-21：不做 continue-on-error —— 拿不到结果时脚本写 STALE 并非 0 退出，让该步骤可见失败
      - name: Sync gate report to docs/gates/
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python work/sync_gate_docs.py \
            --report work/online-gate-report.md \
            --results work/online-gate-results.json \
            --out online-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gates/
          if ! git diff --cached --quiet; then
            git commit -m "docs(gates): sync online gate report [skip ci]" \
              -m "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            # 与 star7-gate 并发写 docs/gates/ 时，后到者会被拒；rebase 后重试，避免误报失败。
            for i in 1 2 3; do
              git push && break
              echo "push 被拒，rebase 后重试 $i/3"
              git pull --rebase origin main
              sleep 3
            done
            git push
          else
            echo "docs/gates/ 无变化，跳过提交"
          fi

      - name: Upload online gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star7-online-gate-report
          path: |
            work/online-gate-report.md
            work/online-gate-results.json
          if-no-files-found: warn
