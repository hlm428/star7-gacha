name: star7-online-gate

# P8 · O-14：部署后环境门禁（只打真实线上 URL，不改动 regression_v5_gate.py 的任何断言）
# 触发：Pages 部署产生 deployment_status（github-pages / success）+ pages-build-deployment 工作流完成 + 手动
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  deployment_status:
  workflow_dispatch:

# 去重：同一次部署的两个触发器按 commit sha 归并到同一 concurrency group，
# 后到的运行会取消仍在进行的前一个，最终每个 commit 只保留一次门禁执行；
# 手动触发按 run_id 独占分组，不会被部署事件取消。
concurrency:
  group: star7-online-gate-${{ github.event.workflow_run.head_sha || github.event.deployment.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # P9 · O-20：把线上门禁摘要写回 docs/gates/ 需要 contents 写权限

jobs:
  online-gate:
    # Pages 部署成功才跑；deployment_status 只接受 github-pages 环境 + success；手动触发不受此限制
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: work/requirements-ci.txt

      - name: Install Playwright（仅测试依赖，产品仍为零依赖单文件）
        run: |
          python -m pip install --upgrade pip
          pip install -r work/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run online gate（O1 console / O2 pageerror / O3 4xx-5xx / O4 28 webp / O5 42 mp3 / O6 冷加载 / O7 版本）
        run: python work/online_gate.py

      - name: Publish PASS/FAIL to job summary
        if: always()
        run: |
          {
            echo "## star7 online gate（部署后环境门禁）"
            echo ""
            if [ -f work/online-gate-report.md ]; then
              cat work/online-gate-report.md
            else
              echo "❌ 未生成 work/online-gate-report.md：线上门禁脚本可能提前失败，请查看上方步骤日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail run visibly when gate failed
        if: failure()
        run: |
          echo "❌ 线上门禁 FAIL：详见本 run 的 Summary 与 online_gate.py 日志。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # P9 · O-20：PASS/FAIL 摘要同步写回仓库公开文档 docs/gates/online-gate.md（保留 job summary）
      # 公开文档只保留判定结果（剔除波动实测值与 run URL），结论不变时 diff 为空 → 不提交，避免自激循环
      - name: Sync gate report to docs/gates/
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python work/sync_gate_docs.py \
            --report work/online-gate-report.md \
            --results work/online-gate-results.json \
            --out online-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gates/
          if ! git diff --cached --quiet; then
            git commit -m "docs(gates): sync online gate report [skip ci]" \
              -m "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          else
            echo "docs/gates/ 无变化，跳过提交"
          fi

      - name: Upload online gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star7-online-gate-report
          path: |
            work/online-gate-report.md
            work/online-gate-results.json
          if-no-files-found: warn
