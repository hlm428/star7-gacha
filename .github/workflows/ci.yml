name: star7-gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: star7-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # P9 · O-20：把门禁摘要写回 docs/gates/ 需要 contents 写权限

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: work/requirements-ci.txt

      - name: Install Playwright（仅测试依赖，产品仍为零依赖单文件）
        run: |
          python -m pip install --upgrade pip
          pip install -r work/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Build single-file index.html
        run: python work/build.py

      - name: Run release gate（A 资金 / B 存档 / C 抽卡 / D 流程 / E 性能 / F 提示 / G 版本）
        run: python work/regression_v5_gate.py

      - name: Publish PASS/FAIL to job summary
        if: always()
        run: |
          if [ -f work/v5-gate-report.md ]; then
            cat work/v5-gate-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成 work/v5-gate-report.md：门禁脚本可能提前失败" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish PASS/FAIL to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f work/v5-gate-report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file work/v5-gate-report.md
          fi

      # P9 · O-20：PASS/FAIL 摘要同步写回仓库公开文档 docs/gates/v5-gate.md（保留 summary 与 PR 评论）
      - name: Sync gate report to docs/gates/
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python work/sync_gate_docs.py \
            --report work/v5-gate-report.md \
            --results work/v5-gate-results.json \
            --out v5-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gates/
          if ! git diff --cached --quiet; then
            git commit -m "docs(gates): sync v5 release gate report [skip ci]" \
              -m "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          else
            echo "docs/gates/ 无变化，跳过提交"
          fi

      - name: Upload gate report / screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star7-gate-report
          path: |
            work/v5-gate-report.md
            work/v5-gate-results.json
            work/gate-shots/
          if-no-files-found: warn
